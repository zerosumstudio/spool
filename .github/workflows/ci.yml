name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Test (with coverage)
              run: pnpm run test:coverage

            - name: Keep the coverage report
              if: matrix.os == 'ubuntu-latest'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: packages/cli/coverage/lcov.info
                  retention-days: 1

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        needs: test
        # Only this job can mint an OIDC token, and it never installs or runs workspace code.
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download the coverage report
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: coverage
                  path: packages/cli/coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  use_oidc: true
                  disable_search: true
                  files: ./packages/cli/coverage/lcov.info
                  fail_ci_if_error: false

    build:
        name: Build, pack and keep the tarball
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Pack the tarball
              run: pnpm --filter @zerosumstudio/spool pack --pack-destination "$RUNNER_TEMP/pack"

            - name: Upload the tarball
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/pack/zerosumstudio-spool-*.tgz
                  if-no-files-found: error
                  retention-days: 7

    matrix:
        name: Packed CLI, generated workspace (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: react, no addons
                      os: ubuntu-latest
                      addons: none
                      host: shell
                      remotes: dashboard
                      framework: react
                    - name: react, every addon
                      os: ubuntu-latest
                      host: shell
                      remotes: dashboard
                      framework: react
                    - name: react, every addon, Windows
                      os: windows-latest
                      host: shell
                      remotes: dashboard
                      framework: react
                    - name: vue, every addon
                      os: ubuntu-latest
                      # ladle needs a React app, so it is left out of a workspace without one.
                      addons: playwright,lint,test,turbo,state,sentry,navigation
                      host: shell
                      remotes: dashboard
                      framework: vue
                    - name: svelte, every addon
                      os: ubuntu-latest
                      # ladle needs a React app, so it is left out of a workspace without one.
                      addons: playwright,lint,test,turbo,state,sentry,navigation
                      host: shell
                      remotes: dashboard
                      framework: svelte
                    - name: mix, react host
                      os: ubuntu-latest
                      host: shell:react
                      remotes: vue-app:vue,svelte-app:svelte
                      framework: react
                    - name: mix, vue host
                      os: ubuntu-latest
                      host: shell:vue
                      remotes: react-app:react,svelte-app:svelte
                      framework: vue
                    - name: mix, svelte host
                      os: ubuntu-latest
                      host: shell:svelte
                      remotes: react-app:react,vue-app:vue
                      framework: svelte
        env:
            # An entry with no addons set gets every addon, so the type-check, lint and build see every generated file.
            ALL_ADDONS: ladle,playwright,lint,test,turbo,state,sentry,navigation

        steps:
            # The runner context isn't available in job env, so the path is set once here.
            - name: Set the workspace path
              shell: bash
              run: echo "WORKSPACE=$RUNNER_TEMP/generated" >> "$GITHUB_ENV"

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Download the tarball
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/package

            - name: Install the packed CLI
              shell: bash
              run: npm install --prefix "$RUNNER_TEMP/cli" "$RUNNER_TEMP"/package/zerosumstudio-spool-*.tgz

            - name: Scaffold the workspace
              shell: bash
              env:
                  HOST: ${{ matrix.host }}
                  REMOTES: ${{ matrix.remotes }}
                  FRAMEWORK: ${{ matrix.framework }}
                  ADDONS: ${{ matrix.addons || env.ALL_ADDONS }}
              run: >-
                  node "$RUNNER_TEMP/cli/node_modules/@zerosumstudio/spool/dist/index.js"
                  create "$WORKSPACE" --name generated --host "$HOST" --remotes "$REMOTES"
                  --framework "$FRAMEWORK" --pm pnpm --addons "$ADDONS" --no-install

            - name: Point the workspace at the tarball
              shell: bash
              working-directory: ${{ env.WORKSPACE }}
              run: |
                  TARBALL=$(ls "$RUNNER_TEMP"/package/zerosumstudio-spool-*.tgz) node -e '
                    const fs = require("fs");
                    const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                    pkg.devDependencies["@zerosumstudio/spool"] = "file:" + process.env.TARBALL.replaceAll("\\", "/");
                    fs.writeFileSync("package.json", JSON.stringify(pkg, null, "\t") + "\n");
                  '

            - name: Install workspace dependencies
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm install --no-frozen-lockfile

            - name: Type check
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm run type-check

            - name: Lint
              if: matrix.addons != 'none'
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm run lint

            - name: Format check
              if: matrix.addons != 'none'
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm run format:check

            - name: Doctor
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm exec spool doctor

            - name: Build
              working-directory: ${{ env.WORKSPACE }}
              run: pnpm exec spool build

    e2e:
        name: E2E (federation, @module-federation/vite ${{ matrix.mf-vite || 'from the generated range' }})
        runs-on: ubuntu-latest
        needs: test
        strategy:
            fail-fast: false
            matrix:
                # Empty takes what the generated range resolves to; 1.17.1 is built on the runtime spool pins.
                mf-vite: ['', '1.17.1']

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install browsers
              run: pnpm --filter @zerosumstudio/spool exec playwright install --with-deps chromium firefox webkit

            - name: Retry and preload in real browsers
              run: pnpm --filter @zerosumstudio/spool test:e2e
              env:
                  SPOOL_E2E_MF_VITE: ${{ matrix.mf-vite }}

            - name: Upload traces
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-results-${{ matrix.mf-vite || 'latest' }}
                  path: packages/cli/test-results
                  retention-days: 7
